<div class="modalContainer" *ngIf = "isModalOpen">
  <div class="modal">
    <div class="info"> 
      <h3>⚠️ {{ 'no_internet' | transloco}}</h3>
       <p> {{'please_internet' | transloco}}</p>
    </div>
    </div>
       <div class="buttonContainer">
      <button class="closeButton" (click) = "onClose()">x</button>
    </div>
</div>

<header>
  <nav>
    <span class="nav-logo">The Art of Spain</span>
    <button (click)="cambiarIdioma()">
      {{ 'change_language' | transloco }}
    </button>
  </nav>
</header>

<app-show [show]="show"></app-show>

  <div class="video-section">
  <div class="section-header">
    <div class="section-line"></div>
  </div>
  <div class="video-wrapper" *ngIf = "!isOffline; else isOfflineVideo">
    <iframe
      src="https://www.youtube.com/embed/kQ37bCkKhaw"
      title="The Art of Spain - Trailer"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
  </div>
</div>

<ng-template #isOfflineVideo>
  <div class="videoOffline">
    <p>{{ 'no_connection' | transloco}}</p>
  </div>
</ng-template>

<section id="episodes">
  <div class="section-header">
    <h2 class="section-label">{{ 'episodes' | transloco }}</h2>
    <div class="section-line"></div>
  </div>
  <div class="episodesContainer">
    <app-episode-list
      *ngFor="let episode of episodes"
      [episode]="episode">
    </app-episode-list>
  </div>
</section>

<section id="cast">
  <div class="section-header">
    <h2 class="section-label">{{ 'cast' | transloco }}</h2>
    <div class="section-line"></div>
  </div>
  <app-cast [cast]="cast"></app-cast>
</section>


<section class="footer">
  <p>API TvMaze</p>
  <p>Created by Laura Giraldo</p>
  <p>&copy; 2026</p>
</section>
